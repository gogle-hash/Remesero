<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Remesas</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1239b8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Remesas">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --green:#006400; 
  --green2:#0a8f45;
  --blue:#00008B; 
  --blue2:#1239b8;
  --light:#f5f8ff; 
  --text:#12213d;
  --grid:#dce4f1;
}
*{box-sizing:border-box}
body{margin:0;background:var(--light);color:var(--text);font-family:Arial,Helvetica,sans-serif}
.app{width:min(520px,100vw);margin:0 auto;min-height:100vh;background:#fff;box-shadow:0 0 20px rgba(0,0,0,0.05);}

/* Topbar moderna con gradiente */
.topbar{
  height:55px;
  background:linear-gradient(100deg, var(--green2), var(--blue2));
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:800;
  border-radius:0 0 20px 20px;
  box-shadow:0 6px 15px rgba(18,57,184,.2);
  margin-bottom:20px;
}
.content{padding:8px 15px 20px}

/* Cajas de inputs redondeadas y modernas */
.label{font-size:12px;font-weight:800;color:#63708a;margin:0 0 6px;padding-left:4px;}
.rate-box, .info-row {
  display:grid;grid-template-columns:38% 62%;
  height:48px;
  border:2px solid var(--grid);
  border-radius:14px;
  margin-bottom:15px;
  overflow:hidden;
  transition: .2s;
  background: #f8faff;
}
.rate-box:focus-within, .info-row:focus-within {
  border-color: var(--blue2);
  box-shadow: 0 0 0 4px rgba(18,57,184,.09);
  background: #fff;
}

.rate-title{background:linear-gradient(145deg, var(--green2), var(--green));color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.rate-input{border:0;outline:0;background:transparent;width:100%;text-align:center;font-size:20px;font-weight:900;color:var(--text)}

.info-title{background:linear-gradient(145deg, var(--blue2), var(--blue));color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.info-value{display:flex;align-items:center;justify-content:center;}
.margin-input{width:100%;height:100%;border:0;outline:0;background:transparent;text-align:center;font-size:20px;font-weight:900;color:var(--text)}

/* Tabla modernizada */
.table-wrap{
  position:relative;
  border:1px solid var(--grid);
  border-radius:14px;
  overflow:hidden;
  box-shadow: 0 5px 15px rgba(0,0,0,.03);
  margin-top: 10px;
}
table{width:100%;border-collapse:collapse;table-layout:fixed;background:#fff;}
th,td{border:1px solid var(--grid);text-align:center;padding:8px 4px}
th{color:#fff;font-size:14px;font-weight:800;height:42px}
th:first-child{background:var(--green2);width:33%}
th:nth-child(2){background:var(--blue2);width:40%}
th:nth-child(3){background:var(--blue2);width:27%}

td.qty{background:#e9f8ef;color:var(--green);font-size:15px;font-weight:900}
td.client{background:#fff;color:var(--text);font-size:14px;font-weight:800}
td.profit{background:#edf2fa;color:var(--blue2);font-size:14px;font-weight:900}

/* Botón y Menú Desplegable */
.currency-th{position:relative;padding:0!important}
.currency-button{width:100%;height:42px;border:0;background:transparent;color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer}
.chevron{font-size:16px;line-height:1;transition:.2s}
.currency-menu.open + .currency-button .chevron {transform: rotate(180deg);}

.currency-menu{
  display:none;position:absolute;z-index:100;left:4px;top:44px;
  min-width:220px;width:max-content;max-width:280px;
  background:#ffffff;border:1px solid var(--grid);
  border-radius:12px;
  box-shadow:0 10px 25px rgba(0,0,0,.15);
  max-height:280px;overflow-y:auto;text-align:left;
}
.currency-menu.open{display:block; animation:fadeIn .2s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}

.currency-option{
  padding:12px 14px;border-bottom:1px solid #edf2fa;background:#ffffff;
  color:var(--text);font-size:14px;font-weight:700;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  transition:.1s;
}
.currency-option:last-child{border-bottom:0;}
.currency-option:hover,.currency-option.active{background:#e9f8ef;color:var(--green2)}
.currency-option .rule{font-size:11px;color:#63708a;font-weight:700;white-space:nowrap;background:#f5f8ff;padding:2px 6px;border-radius:6px;}
.currency-option.active .rule{background:#c6eed7;color:var(--green2);}

@media(max-width:360px){
  th{font-size:12px}.currency-button{font-size:12px}
  td.qty,td.client,td.profit{font-size:12px}
  .content{padding:8px 10px 20px}
}

.custom-row td{border-top:2px solid var(--green2); background: #f8faff;}
.custom-cell{padding:5px!important; background:#fff!important;}
.custom-qty{
  width:100%;height:34px;border:1.5px dashed var(--green2);
  border-radius:8px;background:#f8faff;
  text-align:center;font-size:15px;font-weight:900;outline:0;
  color:var(--text);transition:.2s;
}
.custom-qty::placeholder{color:#94a3b8;font-weight:700}
.custom-qty:focus{border:2px solid var(--green2);background:#fff;box-shadow: 0 2px 8px rgba(10,143,69,.15);}

.developer-credit{
  margin-top:25px;padding:15px 4px;text-align:center;
  font-size:12px;font-weight:700;color:#94a3b8;
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">Calculadora Remesas</div>

  <main class="content">
    <div class="label">Precio de la moneda base</div>
    <div class="rate-box">
      <div class="rate-title">USDT</div>
      <input id="baseRate" class="rate-input" type="number" min="0" step="0.01" value="760" aria-label="Precio USDT">
    </div>

    <div class="label">Configuración de ganancias</div>
    <div class="info-row">
      <div class="info-title">Margen</div>
      <div class="info-value"><input id="marginInput" class="margin-input" type="number" min="0" step="0.01" value="10" inputmode="decimal" aria-label="Margen en CUP"></div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="currency-th">
              <button class="currency-button" id="currencyButton" type="button">
                <span id="thCurrency">Zelle</span><span class="chevron">▼</span>
              </button>
              <div class="currency-menu" id="currencyMenu"></div>
            </th>
            <th>Cliente</th>
            <th>Ganancia</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <div class="developer-credit">Desarrollado por JavierSL.David Paumier</div>
  </main>
</div>

<script>
const DEFAULT_MARGIN=10;
const RANGES=[1,50,100,150,200,250,300];
const CURRENCIES=[
{name:"Zelle",type:"percent",value:-7,rule:"−7%"},
{name:"IBAN",type:"percent",value:3,rule:"+3%"},
{name:"Sterlinas",type:"percent",value:10,rule:"+10%"},
{name:"México",type:"units",value:18.3,rule:"18.3 MXN × 1 USDT"},
{name:"Brasil",type:"units",value:5.60,rule:"5.60 BRL × 1 USDT"},
{name:"PayPal USD",type:"percent",value:-10,rule:"−10%"},
{name:"Cash App",type:"percent",value:-10,rule:"−10%"},
{name:"Western Union",type:"percent",value:-10,rule:"−10%"},
{name:"PostaPay",type:"percent",value:0,rule:"1×1"},
{name:"PayPal EUR",type:"percent",value:0,rule:"1×1"},
{name:"Bizum",type:"percent",value:0,rule:"1×1"},
{name:"Uruguay",type:"units",value:48,rule:"48 UYU × 1 USDT"},
{name:"Rusia",type:"units",value:103,rule:"103 RUB × 1 USDT"},
{name:"Emiratos Árabes",type:"units",value:4.8,rule:"4.8 AED × 1 USDT"},
{name:"Angola",type:"units",value:1850,rule:"1850 AOA × 1 USDT"},
{name:"Suriname",type:"units",value:55,rule:"55 SRD × 1 USDT"},
{name:"Guyana",type:"units",value:450,rule:"450 GYD × 1 USDT"},
{name:"Venezuela",type:"units",value:1500,rule:"1500 VES × 1 USDT"},
{name:"Canadá",type:"usdt",value:0.53,rule:"0.53 USDT × 1 CAD"},
{name:"Ecuador",type:"usdt",value:0.83,rule:"0.83 USDT × 1 USD"},
{name:"Costa Rica",type:"units",value:650,rule:"650 CRC × 1 USDT"},
{name:"Argentina",type:"units",value:2000,rule:"2000 ARS × 1 USDT"},
{name:"Chile",type:"units",value:1500,rule:"1500 CLP × 1 USDT"},
{name:"Colombia",type:"units",value:4500,rule:"4500 COP × 1 USDT"},
{name:"Perú",type:"units",value:4.5,rule:"4.5 PEN × 1 USDT"},
{name:"Bolivia",type:"units",value:15,rule:"15 BOB × 1 USDT"}
];

const baseRate=document.getElementById("baseRate");
const marginInput=document.getElementById("marginInput");
const rows=document.getElementById("rows");
const thCurrency=document.getElementById("thCurrency");
const menu=document.getElementById("currencyMenu");
let selected="Zelle";

// 1. FUNCIÓN PARA CARGAR DATOS GUARDADOS
function loadSavedData() {
  const savedRate = localStorage.getItem('remesas_baseRate');
  const savedMargin = localStorage.getItem('remesas_margin');
  const savedCurrency = localStorage.getItem('remesas_currency');

  if (savedRate) baseRate.value = savedRate;
  if (savedMargin) marginInput.value = savedMargin;
  if (savedCurrency && CURRENCIES.some(c => c.name === savedCurrency)) {
    selected = savedCurrency;
  }
}

// 2. FUNCIÓN PARA GUARDAR DATOS ACTUALES
function saveData() {
  localStorage.setItem('remesas_baseRate', baseRate.value);
  localStorage.setItem('remesas_margin', marginInput.value);
  localStorage.setItem('remesas_currency', selected);
}

function money(n,d=0){
  if(!Number.isFinite(n))return "—";
  return "$"+n.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
}
function marginValue(){const m=Number(marginInput.value);return Number.isFinite(m)&&m>=0?m:0}
function saleUSDT(){return Math.max(0,(Number(baseRate.value)||0)-marginValue())}
function current(){return CURRENCIES.find(c=>c.name===selected)||CURRENCIES[0]}
function ratePerUnit(c){
  const sale=saleUSDT();
  if(c.type==="percent")return sale*(1+c.value/100);
  return c.value?sale/c.value:0;
}
function clientValue(q,c){return q*ratePerUnit(c)}
function usdtEquivalent(q,c){
  if(c.type==="percent") return q*(1+c.value/100);
  if(c.type==="units") return c.value ? q/c.value : 0;
  if(c.type==="usdt") return q*c.value;
  return q;
}
function profitValue(q,c){return usdtEquivalent(q,c)*marginValue()}

function buildMenu(){
  menu.innerHTML="";
  CURRENCIES.forEach(c=>{
    const b=document.createElement("div");
    b.className="currency-option"+(c.name===selected?" active":"");
    b.innerHTML=`<span>${c.name}</span><span class="rule">${c.rule}</span>`;
    b.addEventListener("click",()=>{
      selected=c.name;
      menu.classList.remove("open");
      saveData(); // Guardar al seleccionar moneda
      update();
      buildMenu();
    });
    menu.appendChild(b);
  });
}

document.getElementById("currencyButton").addEventListener("click",e=>{
  e.stopPropagation();
  menu.classList.toggle("open");
});
document.addEventListener("click",()=>menu.classList.remove("open"));

function update(){
  const c=current(),sale=saleUSDT();
  thCurrency.textContent=c.name;
  rows.innerHTML="";
  RANGES.forEach(q=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td class="qty">${q.toLocaleString("en-US")}</td>
      <td class="client">${money(clientValue(q,c),0)}</td>
      <td class="profit">${money(profitValue(q,c),2)}</td>`;
    rows.appendChild(tr);
  });

  const custom=document.createElement("tr");
  custom.className="custom-row";
  custom.innerHTML=`<td class="qty custom-cell">
      <input id="customQty" class="custom-qty" type="number" min="0" step="0.01"
             inputmode="decimal" placeholder="Cantidad">
    </td>
    <td class="client" id="customClient">—</td>
    <td class="profit" id="customProfit">—</td>`;
  rows.appendChild(custom);

  const customInput=document.getElementById("customQty");
  customInput.addEventListener("input",()=>{
    const q=Number(customInput.value);
    document.getElementById("customClient").textContent=q>0?money(clientValue(q,c),2):"—";
    document.getElementById("customProfit").textContent=q>0?money(profitValue(q,c),2):"—";
  });
}

// Escuchar cambios y guardar
baseRate.addEventListener("input", () => { update(); saveData(); });
marginInput.addEventListener("input", () => { update(); saveData(); });

// Inicializar
loadSavedData();
buildMenu();
update();

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
</body>
</html>
