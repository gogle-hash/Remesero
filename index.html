<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#071018">
<title>Calculadora Divisas</title>
<style>
:root{
  --bg:#f8f6ed;--panel:#fbfaf3;--text:#20252a;--muted:#4c5359;--line:rgba(60,70,72,.24);
  --shadow:rgba(80,88,88,.18);--green:#168d58;--blue:#1779b9;--red:#bd454c;
  --glass:rgba(255,255,255,.58);--nav:rgba(255,255,255,.62);--input:#f7f5ec;
}
html[data-theme="dark"]{
  --bg:#071018;--panel:#0a141d;--text:#edf4f5;--muted:#a9b4bb;--line:rgba(202,221,226,.22);
  --shadow:rgba(0,0,0,.55);--green:#2ab97b;--blue:#45a6e6;--red:#ef626c;
  --glass:rgba(28,43,53,.66);--nav:rgba(25,34,42,.76);--input:#111d26;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;transition:background .3s,color .3s}
button,input,select{font:inherit}
.app{width:min(520px,100%);min-height:100vh;margin:auto;padding:26px 18px 118px;position:relative;overflow:hidden}
.header{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin:6px 2px 22px}
.title{font-size:43px;line-height:1.04;font-weight:300;letter-spacing:-2px;margin:0;max-width:285px}
.gear{width:68px;height:68px;flex:0 0 68px;border:0;border-radius:50%;display:grid;place-items:center;position:relative;cursor:pointer;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.9),rgba(177,188,190,.42) 47%,rgba(120,133,137,.26) 100%);box-shadow:inset 0 2px 8px rgba(255,255,255,.8),0 10px 22px var(--shadow);backdrop-filter:blur(8px);color:var(--muted);font-size:33px;text-shadow:0 2px 2px rgba(255,255,255,.75)}
.gear:active{transform:scale(.96)}
.section{margin-bottom:18px}
.field-row{display:grid;grid-template-columns:1fr 255px;align-items:center;gap:18px;margin:10px 0}
.field-label{font-size:24px;font-weight:400;letter-spacing:-.6px}
.input-shell{height:50px;border:1px solid var(--line);border-radius:11px;background:var(--glass);box-shadow:0 5px 0 rgba(110,120,120,.13),0 7px 15px var(--shadow);display:flex;align-items:center;padding:0 15px;backdrop-filter:blur(8px)}
.input-shell input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:25px;font-weight:400}
.table-wrap{margin:22px auto 0;position:relative;overflow:visible;width:100%;max-width:100%}
table{width:100%;max-width:100%;margin:0 auto;border-collapse:collapse;table-layout:fixed;font-size:17px}
th,td{border-bottom:1px solid var(--line);height:43px;text-align:center;padding:4px 7px}
th{font-weight:400;font-size:21px;border-bottom:2px solid var(--line)}
th:first-child{width:38%;text-align:left;padding-left:15px}
th:nth-child(2){width:34%}
th:nth-child(3){width:28%}
.selector{height:47px;width:100%;border:1px solid var(--line);border-radius:11px;background:linear-gradient(135deg,var(--glass),rgba(225,228,220,.32));box-shadow:0 4px 0 rgba(110,120,120,.12),0 5px 12px var(--shadow);color:var(--text);display:flex;align-items:center;justify-content:space-between;padding:0 11px;font-size:20px;cursor:pointer}
.chev{font-size:24px;line-height:1;transform:translateY(-2px)}
.dropdown{position:absolute;z-index:50;left:0;top:60px;width:min(300px,78vw);max-height:310px;overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:0 18px 40px var(--shadow);display:none}
.dropdown.show{display:block;animation:drop .18s ease}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.option{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer;color:var(--text);font-size:16px}
.option:last-child{border-bottom:0}.option.active{background:rgba(40,150,100,.12);font-weight:700}.rule{font-size:11px;color:var(--muted);white-space:nowrap}
td.name{text-align:left;padding-left:13px;font-size:17px}
tr.green td{color:var(--green);background:linear-gradient(90deg,transparent,rgba(40,180,120,.10),transparent)}
tr.blue td{color:var(--blue);background:linear-gradient(90deg,transparent,rgba(60,150,220,.10),transparent)}
tr.red td{color:var(--red);background:linear-gradient(90deg,transparent,rgba(220,80,90,.10),transparent)}
td.money{font-size:17px;white-space:nowrap}
.custom td{height:52px;font-size:19px}.custom .custom-label{text-align:left;padding-left:15px}.custom input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:18px;text-align:center}
.custom input::placeholder{color:var(--muted);opacity:.75}
.credit{text-align:center;font-size:15px;margin:28px 0 25px;color:var(--text)}
.more{position:absolute;right:25px;bottom:100px;width:58px;height:58px;border:1px solid var(--line);border-radius:50%;background:var(--glass);color:var(--muted);font-size:23px;letter-spacing:4px;box-shadow:0 8px 20px var(--shadow);backdrop-filter:blur(10px);cursor:pointer}
.more:active{transform:scale(.95)}
.bottom{position:fixed;z-index:100;left:50%;bottom:15px;transform:translateX(-50%);width:min(500px,calc(100% - 28px));height:91px;border:1px solid var(--line);border-radius:32px;background:var(--nav);box-shadow:0 10px 35px var(--shadow),inset 0 1px rgba(255,255,255,.55);backdrop-filter:blur(18px);display:flex;padding:8px}
.nav{flex:1;border:0;background:transparent;border-radius:25px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-size:17px}
.nav.active{color:var(--text);background:rgba(255,255,255,.16)}
.nav-icon{height:40px;display:grid;place-items:center;font-size:31px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.16))}
/* Remesas: tabla más compacta para evitar desplazamiento vertical */
.mode-remesas table{font-size:15px}
.mode-remesas th,.mode-remesas td{height:38px;padding:3px 6px}
.mode-remesas th{font-size:18px}
.mode-remesas td.name{font-size:15px;padding-left:12px}
.mode-remesas td.money{font-size:15px}
.mode-remesas .selector{height:43px;font-size:18px;padding:0 10px}
.mode-remesas .chev{font-size:21px}
.mode-remesas .custom td{height:42px}

/* Botón para cambiar dirección de cálculo en Divisas */
.calc-switch{display:flex;justify-content:center;margin:8px 0 2px}
.calc-switch button{min-width:170px;height:42px;padding:0 18px;border:1px solid var(--line);border-radius:13px;background:linear-gradient(135deg,rgba(42,185,123,.18),rgba(69,166,230,.18));color:var(--text);box-shadow:0 4px 0 rgba(110,120,120,.12),0 7px 16px var(--shadow),inset 0 1px rgba(255,255,255,.28);backdrop-filter:blur(10px);font-size:15px;font-weight:700;letter-spacing:.1px;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,background .2s ease}
.calc-switch button:active{transform:scale(.97);box-shadow:0 2px 0 rgba(110,120,120,.12),0 4px 10px var(--shadow)}
html[data-theme="dark"] .calc-switch button{background:linear-gradient(135deg,rgba(42,185,123,.20),rgba(69,166,230,.20))}
@media(max-width:390px){.calc-switch button{height:40px;min-width:160px;font-size:14px}}

/* Divisas mode */
#divisasView{display:none}.mode-remesas #divisasView{display:none}.mode-divisas #divisasView{display:block}.mode-divisas #remesasView{display:none}
.mode-divisas .title{font-size:43px}
.mode-divisas .field-row{grid-template-columns:1fr 170px}.mode-divisas .field-label{font-size:23px}.mode-divisas .input-shell{height:50px}.mode-divisas .input-shell input{font-size:25px}
.mode-divisas .table-wrap{margin-top:22px}
.mode-divisas th:first-child{width:42%}.mode-divisas th:nth-child(2){width:31%}.mode-divisas th:nth-child(3){width:27%}
/* modal */
.overlay{position:fixed;inset:0;z-index:500;background:rgba(5,12,18,.48);backdrop-filter:blur(7px);display:none;align-items:flex-end;justify-content:center;padding:14px}
.overlay.show{display:flex}.sheet{width:min(520px,100%);max-height:88vh;overflow:auto;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:26px;padding:20px;box-shadow:0 25px 70px rgba(0,0,0,.38);animation:sheet .22s ease}
@keyframes sheet{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.sheet h2{font-size:21px;margin:0}.close{width:38px;height:38px;border:0;border-radius:12px;background:rgba(120,130,140,.13);color:var(--text);font-size:23px}
.settings-label{font-size:12px;font-weight:800;color:var(--muted);display:block;margin:13px 0 6px}.settings-input,.settings-select{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--input);color:var(--text);padding:0 12px;outline:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.save{width:100%;height:48px;border:0;border-radius:13px;background:var(--text);color:var(--bg);font-weight:800;margin-top:16px}.reset{width:100%;height:43px;border:0;border-radius:13px;background:rgba(120,130,140,.12);color:var(--text);font-weight:700;margin-top:8px}.theme-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.theme-btn{height:42px;border:1px solid var(--line);border-radius:11px;background:var(--input);color:var(--text);font-size:12px}.theme-btn.active{outline:2px solid var(--text)}
.toast{position:fixed;z-index:900;left:50%;bottom:120px;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:var(--text);color:var(--bg);padding:10px 15px;border-radius:12px;font-size:13px;transition:.22s}.toast.show{opacity:1;transform:translate(-50%,0)}
.notice{position:fixed;inset:0;z-index:800;background:rgba(5,12,18,.5);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px}.notice.show{display:flex}.notice-card{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:25px;padding:24px;text-align:center;box-shadow:0 25px 70px rgba(0,0,0,.35)}.notice-icon{width:62px;height:62px;border-radius:19px;margin:0 auto 13px;display:grid;place-items:center;font-size:30px;background:var(--text);color:var(--bg)}.notice h2{margin:0 0 8px;font-size:21px}.notice p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}.notice button{width:100%;height:46px;border:0;border-radius:13px;background:var(--text);color:var(--bg);font-weight:800;margin-top:18px}
@media(max-width:390px){.app{padding-left:13px;padding-right:13px}.title,.mode-divisas .title{font-size:38px}.gear{width:62px;height:62px;flex-basis:62px;font-size:30px}.field-row{grid-template-columns:1fr 190px;gap:10px}.field-label{font-size:23px}th{font-size:22px}td.name{font-size:20px}td.money{font-size:19px}.bottom{height:84px}.credit{margin-top:38px}}
</style>
</head>
<body>
<div id="app" class="app mode-divisas">
  <section id="remesasView">
    <header class="header"><h1 class="title">Calculadora<br>Remesas</h1><button class="gear" onclick="openSettings()">⚙</button></header>
    <div class="section">
      <div class="field-row"><div class="field-label">Precio USDT</div><div class="input-shell"><input id="baseRate" type="number" value="760" step="0.01" inputmode="decimal"></div></div>
      <div class="field-row"><div class="field-label">Margen</div><div class="input-shell"><input id="margin" type="number" value="10" step="0.01" inputmode="decimal"></div></div>
    </div>
    <div class="table-wrap"><table><thead><tr><th><button class="selector" id="remesaSelector"><span id="remesaName">Zelle</span><span class="chev">⌄</span></button><div class="dropdown" id="remesaMenu"></div></th><th>CUP</th><th>Ganancia</th></tr></thead><tbody id="remesaRows"></tbody></table></div>
    <div class="credit">Desarrollado por Javi&Pau</div>
  </section>

  <section id="divisasView">
    <header class="header"><h1 class="title">Calculadora<br>Divisas</h1><button class="gear" onclick="openSettings()">⚙</button></header>
    <div class="section">
      <div class="field-row"><div class="field-label">Costo %</div><div class="input-shell"><input id="costo" type="number" value="6" step="0.1" inputmode="decimal"></div></div>
      <div class="field-row"><div class="field-label">Venta %</div><div class="input-shell"><input id="venta" type="number" value="7" step="0.1" inputmode="decimal"></div></div>
    </div>
    <div class="calc-switch"><button id="divisaDirection" onclick="toggleDivisaDirection()">USD → Divisa</button></div>
    <div class="table-wrap"><table><thead><tr><th><button class="selector" id="divisaSelector"><span id="divisaName">Clásica</span><span class="chev">⌄</span></button><div class="dropdown" id="divisaMenu"></div></th><th>CUP</th><th>Ganancia</th></tr></thead><tbody id="divisaRows"></tbody></table></div>
    <div class="credit">Desarrollado por Javi&Pau</div>
  </section>
</div>

<nav class="bottom"><button class="nav" id="navRemesas" onclick="switchMode('remesas')"><span class="nav-icon">💵</span><span>Remesas</span></button><button class="nav active" id="navDivisas" onclick="switchMode('divisas')"><span class="nav-icon">🪙</span><span>Divisas</span></button></nav>

<div class="overlay" id="settingsOverlay" onclick="if(event.target===this)closeSettings()"><div class="sheet"><div class="sheet-head"><h2>⚙️ Ajustes</h2><button class="close" onclick="closeSettings()">×</button></div><div id="remesaSettings"><label class="settings-label">Método / divisa</label><select class="settings-select" id="ruleCurrency"></select><div class="grid"><div><label class="settings-label">Tipo</label><select class="settings-select" id="ruleType"><option value="percent">Porcentaje</option><option value="units">Unidades por 1 USDT</option><option value="usdt">Valor USDT</option></select></div><div><label class="settings-label">Valor</label><input class="settings-input" id="ruleValue" type="number" step="0.01"></div></div></div><div id="divisaSettings" style="display:none"><label class="settings-label">Divisa</label><select class="settings-select" id="divisaRuleCurrency"></select><div class="grid"><div><label class="settings-label">Costo %</label><input class="settings-input" id="ruleCosto" type="number" step="0.1"></div><div><label class="settings-label">Venta %</label><input class="settings-input" id="ruleVenta" type="number" step="0.1"></div></div></div><label class="settings-label">Tema</label><div class="theme-buttons"><button class="theme-btn" data-theme="light">Claro</button><button class="theme-btn" data-theme="dark">Oscuro</button><button class="theme-btn" data-theme="system">Sistema</button></div><button class="save" onclick="saveSettings()">Guardar cambios</button><button class="reset" onclick="resetCurrentRule()">Restaurar regla original</button></div></div>

<div class="notice" id="notice"><div class="notice-card"><div class="notice-icon">⚙</div><h2>Nueva opción disponible</h2><p>Ahora puedes editar las reglas de cálculo directamente desde <b>Ajustes ⚙️</b>.</p><button onclick="closeNotice()">Entendido</button></div></div>
<div class="toast" id="toast"></div>

<script>
const RANGES=[1,50,100,150,200,250,300];
const REMESAS=[
 ['Zelle','usdt',.93,'0.93 USDT × 1 USD'],['IBAN','percent',3,'+3%'],['Sterlinas','percent',10,'+10%'],['México','units',18.3,'18.3 MXN × 1 USDT'],['Brasil','units',5.6,'5.60 BRL × 1 USDT'],['PayPal USD','units',885,'885 CUP × 1 USD (transferencia)'],['Cash App','usdt',.90,'0.90 USDT × 1 USD'],['Wester usa','usdt',.88,'0.88 USDT × 1 USD'],['PostaPay','percent',0,'1×1'],['PayPal EUR','percent',0,'1×1'],['Bizum','percent',0,'1×1'],['Uruguay','units',48,'48 UYU × 1 USDT'],['Rusia','units',103,'103 RUB × 1 USDT'],['Emiratos Árabes','units',4.8,'4.8 AED × 1 USDT'],['Angola','units',1850,'1850 KWZ × 1 USDT'],['Suriname','units',55,'55 SRD × 1 USDT'],['Guyana','units',400,'400 GYD × 1 USDT'],['Dominicana','units',85,'85 × 1 USDT'],['Venezuela','units',1500,'1500 × 1 USDT'],['Canadá','usdt',.53,'0.53 USDT × 1 CAD'],['Ecuador','usdt',.83,'0.83 USDT × 1 USD'],['Costa Rica','units',650,'650 CRC × 1 USDT'],['Argentina','units',2000,'2000 ARS × 1 USDT'],['Chile','units',1500,'1500 CLP × 1 USDT'],['Colombia','units',4500,'4500 COP × 1 USDT'],['Perú','units',4.5,'4.5 SOL × 1 USDT'],['Bolivia','units',15,'15 BOB × 1 USDT'],['Nicaragua','usdt',.80,'0.80 USDT × 1 USD'],['$Nio','usdt',.02,'0.02 USDT × 1 NIO']
].map(x=>({name:x[0],type:x[1],value:x[2],rule:x[3]}));
const DIVISAS=[{name:'Clásica',costo:6,venta:7},{name:'Prepago',costo:10,venta:10},{name:'MLC',costo:65,venta:66}];
let mode=localStorage.getItem('jp_mode')||'divisas', remesa=localStorage.getItem('jp_remesa')||'Zelle', divisa=localStorage.getItem('jp_divisa')||'Clásica';
const $=id=>document.getElementById(id); const app=$('app');
function getRule(c){try{const x=localStorage.getItem('jp_rule_'+c.name);if(x)return JSON.parse(x)}catch(e){}return {type:c.type,value:c.value}}
function getDivRule(c){try{const x=localStorage.getItem('jp_divrule_'+c.name);if(x)return JSON.parse(x)}catch(e){}return {costo:c.costo,venta:c.venta}}
function money(n,d=2){return Number.isFinite(n)?'$'+n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}):'—'}
function saleUSDT(){return Math.max(0,(Number($('baseRate').value)||0)-(Number($('margin').value)||0))}
function remRate(c){const r=getRule(c),s=saleUSDT();if(r.type==='percent')return s*(1+r.value/100);if(r.type==='units')return r.value?s/r.value:0;return s*r.value}
function remClient(q,c){return q*remRate(c)}
function remProfit(q,c){const r=getRule(c);let eq=r.type==='percent'?q*(1+r.value/100):r.type==='units'?(r.value?q/r.value:0):q*r.value;return eq*(Number($('margin').value)||0)}
function buildRemMenu(){const m=$('remesaMenu');m.innerHTML=REMESAS.map(c=>`<div class="option ${c.name===remesa?'active':''}" data-name="${c.name}"><span>${c.name}</span><span class="rule">${c.rule}</span></div>`).join('');m.querySelectorAll('.option').forEach(o=>o.onclick=()=>{remesa=o.dataset.name;localStorage.setItem('jp_remesa',remesa);m.classList.remove('show');render()})}
function buildDivMenu(){const m=$('divisaMenu');m.innerHTML=DIVISAS.map(c=>`<div class="option ${c.name===divisa?'active':''}" data-name="${c.name}"><span>${c.name}</span><span class="rule">Costo ${getDivRule(c).costo}% · Venta ${getDivRule(c).venta}%</span></div>`).join('');m.querySelectorAll('.option').forEach(o=>o.onclick=()=>{divisa=o.dataset.name;const c=DIVISAS.find(x=>x.name===divisa);const r=getDivRule(c);$('costo').value=r.costo;$('venta').value=r.venta;localStorage.setItem('jp_divisa',divisa);m.classList.remove('show');render()})}
function renderRemesas(){const c=REMESAS.find(x=>x.name===remesa)||REMESAS[0];$('remesaName').textContent=c.name;let html=RANGES.map((q,i)=>`<tr class="${i%3===0?'green':i%3===1?'blue':'red'}"><td class="name">${q.toLocaleString('en-US')}</td><td class="money">${money(remClient(q,c),0)}</td><td class="money">${money(remProfit(q,c),2)}</td></tr>`).join('');html+=`<tr class="custom"><td class="custom-label"><input id="customRem" type="number" min="0" step=".01" placeholder="Cant. USD"></td><td id="customRemClient">—</td><td id="customRemProfit">—</td></tr>`;$('remesaRows').innerHTML=html;const inp=$('customRem');inp.oninput=()=>{const q=Number(inp.value);$('customRemClient').textContent=q>0?money(remClient(q,c),0):'—';$('customRemProfit').textContent=q>0?money(remProfit(q,c),2):'—'}}
function renderDivisas(){const c=DIVISAS.find(x=>x.name===divisa)||DIVISAS[0],r=getDivRule(c);$('divisaName').textContent=c.name;$('costo').value=r.costo;$('venta').value=r.venta;const costo=Number(r.costo)||0,venta=Number(r.venta)||0;let html=RANGES.slice(3).map((q,i)=>{const cls=i%3===0?'green':i%3===1?'blue':'red';if(divisaDirection==='reverse'){const div=q*(1+venta/100);const usd=q;const gan=q*(venta-costo)/100;return `<tr class="${cls}"><td class="name">${div.toLocaleString('en-US',{maximumFractionDigits:2})}</td><td class="money">${money(usd,2)}</td><td class="money">${money(gan,2)}</td></tr>`}const cliente=q*(1+venta/100);const gan=q*(venta-costo)/100;return `<tr class="${cls}"><td class="name">${q.toLocaleString('en-US')}</td><td class="money">${money(cliente,2)}</td><td class="money">${money(gan,2)}</td></tr>`}).join('');html+=`<tr class="custom"><td class="custom-label"><input id="customDiv" type="number" min="0" step=".01" inputmode="decimal" placeholder="${divisaDirection==='reverse'?c.name:'Cant. USD'}"></td><td id="customDivClient">—</td><td id="customDivProfit">—</td></tr>`;$('divisaRows').innerHTML=html;$('divisaDirection').textContent=divisaDirection==='reverse'?`${c.name} → USD`:'USD → '+c.name;const inp=$('customDiv');inp.oninput=()=>{const q=Number(inp.value);if(q>0){if(divisaDirection==='reverse'){const usd=q/(1+venta/100);$('customDivClient').textContent=money(usd,2);$('customDivProfit').textContent=money(usd*(venta-costo)/100,2)}else{$('customDivClient').textContent=money(q*(1+venta/100),2);$('customDivProfit').textContent=money(q*(venta-costo)/100,2)}}else{$('customDivClient').textContent='—';$('customDivProfit').textContent='—'}}}
let divisaDirection=localStorage.getItem('jp_divisa_direction')||'normal';
function toggleDivisaDirection(){divisaDirection=divisaDirection==='normal'?'reverse':'normal';localStorage.setItem('jp_divisa_direction',divisaDirection);renderDivisas()}
function render(){app.classList.toggle('mode-divisas',mode==='divisas');app.classList.toggle('mode-remesas',mode==='remesas');$('navDivisas').classList.toggle('active',mode==='divisas');$('navRemesas').classList.toggle('active',mode==='remesas');buildRemMenu();buildDivMenu();renderRemesas();renderDivisas()}
function switchMode(m){mode=m;localStorage.setItem('jp_mode',m);render()}
$('remesaSelector').onclick=e=>{e.stopPropagation();$('remesaMenu').classList.toggle('show');$('divisaMenu').classList.remove('show')};$('divisaSelector').onclick=e=>{e.stopPropagation();$('divisaMenu').classList.toggle('show');$('remesaMenu').classList.remove('show')};document.onclick=()=>{$('remesaMenu').classList.remove('show');$('divisaMenu').classList.remove('show')};
['baseRate','margin','costo','venta'].forEach(id=>$(id).oninput=()=>{if(id==='costo'||id==='venta'){const c=DIVISAS.find(x=>x.name===divisa);localStorage.setItem('jp_divrule_'+c.name,JSON.stringify({costo:Number($('costo').value)||0,venta:Number($('venta').value)||0}))}render()});
function openSettings(){const isR=mode==='remesas';$('remesaSettings').style.display=isR?'block':'none';$('divisaSettings').style.display=isR?'none':'block';$('ruleCurrency').innerHTML=REMESAS.map(c=>`<option>${c.name}</option>`).join('');$('divisaRuleCurrency').innerHTML=DIVISAS.map(c=>`<option>${c.name}</option>`).join('');$('ruleCurrency').value=remesa;$('divisaRuleCurrency').value=divisa;loadSettingsFields();$('settingsOverlay').classList.add('show')}
function loadSettingsFields(){if(mode==='remesas'){const c=REMESAS.find(x=>x.name===$('ruleCurrency').value),r=getRule(c);$('ruleType').value=r.type;$('ruleValue').value=r.value}else{const c=DIVISAS.find(x=>x.name===$('divisaRuleCurrency').value),r=getDivRule(c);$('ruleCosto').value=r.costo;$('ruleVenta').value=r.venta}}
$('ruleCurrency').onchange=loadSettingsFields;$('divisaRuleCurrency').onchange=loadSettingsFields;
function saveSettings(){if(mode==='remesas'){remesa=$('ruleCurrency').value;localStorage.setItem('jp_remesa',remesa);localStorage.setItem('jp_rule_'+remesa,JSON.stringify({type:$('ruleType').value,value:Number($('ruleValue').value)||0}))}else{divisa=$('divisaRuleCurrency').value;localStorage.setItem('jp_divisa',divisa);localStorage.setItem('jp_divrule_'+divisa,JSON.stringify({costo:Number($('ruleCosto').value)||0,venta:Number($('ruleVenta').value)||0}))}closeSettings();render();toast('Cambios guardados')}
function resetCurrentRule(){if(mode==='remesas'){localStorage.removeItem('jp_rule_'+$('ruleCurrency').value)}else{localStorage.removeItem('jp_divrule_'+$('divisaRuleCurrency').value)}loadSettingsFields();render();toast('Regla original restaurada')}
function closeSettings(){$('settingsOverlay').classList.remove('show')}
function setTheme(t){if(t==='system'){localStorage.removeItem('jp_theme');document.documentElement.removeAttribute('data-theme')}else{localStorage.setItem('jp_theme',t);document.documentElement.setAttribute('data-theme',t)}document.querySelectorAll('.theme-btn').forEach(b=>b.classList.toggle('active',b.dataset.theme===t))}
document.querySelectorAll('.theme-btn').forEach(b=>b.onclick=()=>setTheme(b.dataset.theme));function initTheme(){const t=localStorage.getItem('jp_theme')||'dark';setTheme(t)}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').classList.remove('show'),1700)}
function closeNotice(){$('notice').classList.remove('show');localStorage.setItem('jp_notice_1','1')}
window.addEventListener('load',()=>{initTheme();render();if(!localStorage.getItem('jp_notice_1'))setTimeout(()=>$('notice').classList.add('show'),500)})
</script>
</body>
</html>
